<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" font-family="Arial, Helvetica, sans-serif" fill="#191d1b">
  <defs><filter id="smudge"><feGaussianBlur stdDeviation="7"/></filter><pattern id="barcode" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="2" height="5" fill="#222"/></pattern></defs>
  <rect x="1" y="1" width="598" height="248" rx="16" fill="#fff" stroke="#d7d5d0"/>
  <rect x="28" y="22" width="544" height="40" rx="6" fill="#f7a2a2"/>
  <text x="300" y="48" text-anchor="middle" font-size="20" font-weight="bold" letter-spacing="2">FICTIONAL DEMO LABEL</text>
  <text x="32" y="99" font-size="30" font-weight="bold">Levothyroxine Sodium</text>
